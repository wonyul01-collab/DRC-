# 레퍼런스 스타일 — "진짜 잠깐만" 채널 문법
#
# 출처: NotebookLM 채널 분석 → obsidian-shorts-vault-starter.md
# 담는 것은 포맷과 문법이지 대본이 아닙니다. 예시 문구는 "틀"을 보여주려고
# 남겨둔 것이고, 그대로 쓰라는 뜻이 아닙니다. do_not_copy 를 반드시 읽으세요.

reference:
  channel_name: "진짜 잠깐만"
  channel_url: ""
  analyzed_videos: 0                 # 분석 편수 (NotebookLM 소스 기준으로 채우세요)
  analyzed_at: "2026-08-13"
  one_line: "누구나 궁금해할 대결·실험·황당 이슈를 60초 안에 몰아치고, 결과 직전에 잘라버리는 채널."

# ---------------------------------------------------------------
# 1. 후킹 — 첫 3초
# ---------------------------------------------------------------
hooking:
  types:
    - name: "라이벌대결형"
      pattern: "[대상 A] vs [대상 B], 과연 누가 더 [형용사]할까?"
      example_structure: "장비가 좋은 초보 vs 실력이 좋은 전문가처럼, 시청자가 한쪽 편을 들게 만드는 비대칭 구도"
      frequency: "high"
      viewer_reaction: "편 들기 → 승부 확인하려고 끝까지 봄"
    - name: "기발한가설형"
      pattern: "[터무니없는 조건]을 적용하면 과연 [도전 과제]가 가능할까?"
      example_structure: "물리적으로 말이 안 되는 조합을 진지하게 실행. 조건이 엉뚱할수록 강함"
      frequency: "high"
      viewer_reaction: "호기심 → 결과 보려고 끝까지 봄"
    - name: "Pain-Point형"
      pattern: "[누구나 겪는 사소하지만 빡치는 상황], 해결하는 기막힌 방법"
      example_structure: "상황 공감 먼저 → 해결책 제시. 제품/팁 계열에 씀"
      frequency: "medium"
      viewer_reaction: "내 얘기다 → 해결책 보려고 끝까지 봄"
    - name: "충격선언형"
      pattern: "[특정 대상]이 저지르고 있는 충격적인 상황"
      example_structure: "감정(분노·놀람)을 정면으로 자극해 댓글 참여 유도"
      frequency: "medium"
      viewer_reaction: "감정 반응 → 댓글"
      # ⚠ 아래 guardrails.high_risk_categories 를 반드시 확인하고 쓰세요.
      caution: "국가·민족·집단 비하로 흐르면 증오심 표현 정책에 걸립니다."

  opening_caption:
    max_chars: 24
    lines: 2
    timing_seconds: 3.0
    style_note: "질문형 자막을 화면 중앙~상단에 크게. 나레이션과 동시에."
  retention_device: "질문을 던지고 답을 마지막까지 미룬다. 답은 끝내 안 주기도 한다(절단마공)."

# ---------------------------------------------------------------
# 2. 구조 — 핑퐁식 전개
# ---------------------------------------------------------------
structure:
  total_seconds: [45, 60]
  beats:
    - range_seconds: [0, 3]
      role: "도입"
      note: "후킹 질문 제시 + 대결/도전 대상 설정"
    - range_seconds: [3, 40]
      role: "전개"
      note: "쉴 새 없는 시행착오. '우선 → 다음은 → 하지만 → 그래서' 로 조건을 빠르게 바꿔 시공간을 압축한다. 실패를 쌓아 텐션을 올린다."
    - range_seconds: [40, 50]
      role: "절정"
      note: "현실 변수(돌발 상황) 또는 실시간 핸디캡 투입. 우열이 뒤집혀야 한다."
    - range_seconds: [50, 60]
      role: "결말"
      note: "절단마공 — 결과가 터지기 직전에 강제로 끊는다."

  cut_rhythm:
    avg_shot_seconds: 2.0
    style: "절단마공 — 말이나 동작이 끝나기 전에 자른다. 여운을 주지 않는다."
    note: "전개 구간은 컷을 더 짧게(1.5초), 절정은 살짝 길게(2.5~3초) 가져가면 리듬이 산다."

  ending:
    style: "절단마공"
    signature: "짧은 감탄사 한 마디로 끝낸다"
    # 카테고리별 컷 차단 타점과 감탄사
    cut_points:
      - category: "실험/도전"
        video_cut: "결과가 터지기 직전, 날아가기 직전의 찰나"
        sfx: ["Oh God", "No", "그 순간..."]
      - category: "제품리뷰"
        video_cut: "비포/애프터 반전이 나오고 1초 뒤"
        sfx: ["Oh my goodness", "No"]
      - category: "대결/승부"
        video_cut: "마지막 슛을 쏘거나 도망가는 타점"
        sfx: ["Yeah", "Oh God"]
      - category: "정보/이슈"
        video_cut: "한 줄 평이 끝난 직후"
        sfx: ["씁쓸하네요"]
    cta: "명시적 CTA 없음. 감탄사로 끊고 끝낸다. (구독 유도는 설명란에서)"

  # ★ 이 채널의 최대 무기. compose_short.py 로 구현하려면 마지막 shot 을
  #   무음(narration: "")으로 두고 duration 을 0.6~1.0 초로 잡으면 됩니다.
  silence_trick:
    enabled: true
    note: "긴장 음악을 깔다가 마지막 감탄사 타점에서 BGM·소음을 전부 0으로 뮤트. 무음 + 블랙아웃 조합."
    blackout_seconds: 0.8

# ---------------------------------------------------------------
# 3. 자막 — compose_short.py 가 그대로 읽는다
# ---------------------------------------------------------------
subtitle:
  # ★ 시스템에 실제로 설치된 패밀리명이어야 합니다. 다르면 조용히 기본 폰트로 떨어져서
  #   자막이 밋밋해지거나 네모로 깨집니다. 반드시 확인하세요:
  #     fc-list :lang=ko family | tr ',' '\n' | sort -u
  #   Ubuntu/WSL 의 fonts-noto-cjk 는 "Noto Sans CJK KR" 입니다 ("Noto Sans KR" 아님).
  #   맑은 고딕은 "Malgun Gothic", 프리텐다드는 "Pretendard".
  font_family: "Noto Sans CJK KR"
  font_file: ""
  font_size: 78
  bold: true
  primary_color: "&H00FFFFFF"       # 흰색
  outline_color: "&H00000000"       # 검정 외곽선
  outline_width: 5
  shadow: 0
  alignment: 2                      # 하단 중앙
  margin_vertical: 340              # 쇼츠 UI에 안 가리게
  max_chars_per_cue: 16             # 툭툭 던지는 리듬
  lead_seconds: -0.05               # 소리보다 아주 살짝 먼저
  style_note: "비포/애프터나 반전 구간에서는 자막이 즉시 바뀌며 '사이다'를 준다. 강조어는 색을 바꿔도 좋다."

# ---------------------------------------------------------------
# 4. 목소리
# ---------------------------------------------------------------
voice:
  provider: "edge"
  name: "ko-KR-InJoonNeural"        # 남성. 여성은 ko-KR-SunHiNeural
  rate: "+15%"                      # 몰아치는 속도
  pitch: "+0Hz"
  volume: "+0%"
  tone_note: "빠르고 담백. 과장된 리액션은 나레이션이 아니라 효과음이 맡는다."
  silent_sections: "엔딩 감탄사 직후 0.8초. silence_trick 참고."

# ---------------------------------------------------------------
# 5. 영상
# ---------------------------------------------------------------
visual:
  aspect_ratio: "9:16"
  resolution: "1080x1920"
  fps: 30
  mood: "채도·대비 강함. 밝고 선명하게."
  camera: "고정샷과 클로즈업 교차. 절정 구간에서 급격한 줌인 1회."
  subject_type: "실사 기반"
  bgm_note: "긴장감 있는 BGM을 깔다가 엔딩 타점에 전면 뮤트."
  recurring: "질문형 오프닝 자막 → 빠른 실패 몽타주 → 절단 엔딩"

# ---------------------------------------------------------------
# 6. AI 생성 적합도 — 이 채널을 그대로 따라 할 수 없는 이유
# ---------------------------------------------------------------
# 이 채널의 가치는 상당 부분 "실제로 해봤다"에서 나옵니다.
# AI로 만든 실험 영상은 실험이 아니라 연출입니다. 그래서 카테고리마다
# 옮길 수 있는 정도가 다릅니다. 기획 단계에서 반드시 확인하세요.
ai_fit:
  - category: "기발한가설형 (만약에)"
    fit: "high"
    condition: "명백히 상상/시뮬레이션임이 드러나는 연출로 갈 때. 실사인 척하지 않으면 AI가 가장 잘하는 영역."
  - category: "라이벌대결형"
    fit: "medium"
    condition: "실존 인물·실제 경기가 아니라 가상 캐릭터 대결로 바꿀 때."
  - category: "Pain-Point형 (제품리뷰)"
    fit: "low"
    condition: "실제 제품을 실제로 써본 게 아니면 허위 광고가 됩니다. 제품 없이 하지 마세요."
  - category: "충격선언형 (해외이슈)"
    fit: "avoid"
    condition: "실제 사건을 AI로 재현하면 허위 정보입니다. 이 파이프라인에서는 만들지 않습니다."

# ---------------------------------------------------------------
# 7. 따라 하지 않을 것
# ---------------------------------------------------------------
do_not_copy:
  - "위 예시 문구를 그대로 쓰기 — 문장 틀만 가져오고 소재는 직접 정한다"
  - "같은 소재로 같은 실험 재현하기"
  - "원본 영상 클립, 로고, 시그니처 사운드 파일"
  - "'진짜 잠깐만'과 헷갈릴 만한 채널명"
  - "실존 인물·특정 국적 집단을 대상으로 한 조롱·비하"

guardrails:
  high_risk_categories:
    - name: "해외이슈 / 국가·민족 저격"
      risk: "YouTube 증오심 표현 정책 위반 가능. 수익화 정지 사유."
      rule: "특정 국적·민족·집단을 싸잡아 비하하는 소재는 만들지 않는다."
    - name: "AI로 재현한 '실제 사건'"
      risk: "허위 정보 + 합성 미디어 정책 위반."
      rule: "실제로 일어난 일처럼 보이는 장면을 AI로 만들지 않는다. 상상·시뮬레이션임을 연출과 자막으로 드러낸다."
    - name: "써보지 않은 제품 리뷰"
      risk: "허위 광고. 표시광고법 문제로도 번진다."
      rule: "실물 없이 제품 효과를 주장하지 않는다."
