# 레퍼런스 스타일 — "진짜 잠깐만" 채널 문법
#
# 출처: NotebookLM 채널 분석 → obsidian-shorts-vault-starter.md
# 담는 것은 포맷과 문법이지 대본이 아닙니다. 예시 문구는 "틀"을 보여주려고
# 남겨둔 것이고, 그대로 쓰라는 뜻이 아닙니다. do_not_copy 를 반드시 읽으세요.

reference:
  channel_name: "진짜 잠깐만"
  channel_url: "https://www.youtube.com/@진짜잠깐만"
  analyzed_videos: 200               # analyze_reference.py 표본
  analyzed_at: "2026-08-13"
  one_line: "대결·실험·황당 이슈를 40초 안에 몰아치고 결과 직전에 잘라버리는 채널. 물량으로 히트를 뽑는다."

# ---------------------------------------------------------------
# 0. 실측 (analyze_reference.py) — 인상이 아니라 숫자
# ---------------------------------------------------------------
# 아래 값들은 YouTube Data API 로 뽑은 것입니다. 노트의 추정치와 다르면
# 이쪽이 맞습니다. 다시 재려면:
#   python analyze_reference.py --handle "@진짜잠깐만" --max 200 --calibrate
measured:
  total_videos: 2318
  total_views: 2_450_000_000
  subscribers: 354_000
  views_median: 248_000
  views_p90: 2_610_000
  uploads_per_day: 2.2
  uploads_per_week: 15.7
  # 구독자 / 총조회수. 이 채널이 어떤 게임을 하는지 보여주는 한 숫자.
  subscriber_conversion: 0.00014     # 0.014%

  # ★ 이 두 줄이 이 채널의 정체입니다. 반드시 읽고 넘어가세요.
  interpretation:
    - "품질 게임이 아니라 물량 x 확률 게임. 중앙값 24.8만인데 p90이 261만 —
       극단적 롱테일이다. 개별 영상을 잘 만들어 히기는 채널이 아니라,
       2,318개를 쌓아서 그 중 히트가 나오는 구조다."
    - "구독 전환율 0.014%. 채널 자산(충성 구독자, 상품 전환, 커머스)이 안 쌓인다.
       쇼츠 RPM 단가로만 버는 모델이다."

  # ⚠ 이 채널의 물량은 그대로 따라 하면 안 됩니다. ai_volume_warning 참고.

# ---------------------------------------------------------------
# 1. 후킹 — 첫 3초
# ---------------------------------------------------------------
hooking:
  types:
    - name: "반전형"
      pattern: "[예상되는 결과]인 줄 알았는데, 알고 보니 [뒤집힌 결과]"
      example_structure: "시청자가 답을 안다고 착각하게 만든 뒤 뒤집는다. 마지막까지 봐야 확인된다."
      frequency: "high"
      viewer_reaction: "내 예상이 맞나 확인하려고 끝까지 봄"
    - name: "극단수식형"
      pattern: "역대급/세계 최초/최강 [대상]"
      example_structure: "수식어로 기대치를 끌어올린다. 단독으로 쓰기보다 다른 훅에 얹는 증폭 장치."
      frequency: "high"
      caution: "실제로 그 정도가 아니면 이탈률이 오히려 오른다. 과장 낚시는 지속되지 않는다."
    - name: "라이벌대결형"
      pattern: "[대상 A] vs [대상 B], 과연 누가 더 [형용사]할까?"
      example_structure: "장비가 좋은 초보 vs 실력이 좋은 전문가처럼, 시청자가 한쪽 편을 들게 만드는 비대칭 구도"
      frequency: "high"
      viewer_reaction: "편 들기 → 승부 확인하려고 끝까지 봄"
    - name: "기발한가설형"
      pattern: "[터무니없는 조건]을 적용하면 과연 [도전 과제]가 가능할까?"
      example_structure: "물리적으로 말이 안 되는 조합을 진지하게 실행. 조건이 엉뚱할수록 강함"
      frequency: "high"
      viewer_reaction: "호기심 → 결과 보려고 끝까지 봄"
    - name: "Pain-Point형"
      pattern: "[누구나 겪는 사소하지만 빡치는 상황], 해결하는 기막힌 방법"
      example_structure: "상황 공감 먼저 → 해결책 제시. 제품/팁 계열에 씀"
      frequency: "medium"
      viewer_reaction: "내 얘기다 → 해결책 보려고 끝까지 봄"
    - name: "충격선언형"
      pattern: "[특정 대상]이 저지르고 있는 충격적인 상황"
      example_structure: "감정(분노·놀람)을 정면으로 자극해 댓글 참여 유도"
      frequency: "medium"
      viewer_reaction: "감정 반응 → 댓글"
      # ⚠ 아래 guardrails.high_risk_categories 를 반드시 확인하고 쓰세요.
      caution: "국가·민족·집단 비하로 흐르면 증오심 표현 정책에 걸립니다."

  opening_caption:
    max_chars: 20                    # 실측 보정 (제목 길이 중앙값 기준)
    lines: 2
    timing_seconds: 3.0
    style_note: "질문형 자막을 화면 중앙~상단에 크게. 나레이션과 동시에."
  retention_device: "질문을 던지고 답을 마지막까지 미룬다. 답은 끝내 안 주기도 한다(절단마공)."

# ---------------------------------------------------------------
# 2. 구조 — 핑퐁식 전개
# ---------------------------------------------------------------
structure:
  # 벤치마크 실측은 34~45초지만 우리 채널은 40~60초로 간다.
  # "경험 → 숫자 → 일상 복귀" 3단 구조라 공감 구간이 앞에 붙기 때문이다.
  # playback_speed 1.1 이 걸려 최종 출력은 36~55초가 된다.
  # 그 공감 구간을 잘라내면 다시 사전 읽어주는 영상이 된다.
  total_seconds: [40, 60]
  beats:
    - range_seconds: [0, 3]
      role: "도입"
      note: "후킹 질문 제시 + 대결/도전 대상 설정. 길이는 총 길이와 무관하게 3초 고정."
    - range_seconds: [3, 28]
      role: "전개"
      note: "쉴 새 없는 시행착오. '우선 → 다음은 → 하지만 → 그래서' 로 조건을 빠르게 바꿔 시공간을 압축한다. 실패를 쌓아 텐션을 올린다."
    - range_seconds: [28, 35]
      role: "절정"
      note: "현실 변수(돌발 상황) 또는 실시간 핸디캡 투입. 우열이 뒤집혀야 한다."
    - range_seconds: [35, 40]
      role: "결말"
      note: "절단마공 — 결과가 터지기 직전에 강제로 끊는다."

  cut_rhythm:
    avg_shot_seconds: 2.0            # 40초 / 2초 ≈ 20컷
    style: "절단마공 — 말이나 동작이 끝나기 전에 자른다. 여운을 주지 않는다."
    note: "전개 구간은 컷을 더 짧게(1.5초), 절정은 살짝 길게(2.5~3초) 가져가면 리듬이 산다."

  ending:
    style: "절단마공"
    signature: "짧은 감탄사 한 마디로 끝낸다"
    # 카테고리별 컷 차단 타점과 감탄사
    cut_points:
      - category: "실험/도전"
        video_cut: "결과가 터지기 직전, 날아가기 직전의 찰나"
        sfx: ["Oh God", "No", "그 순간..."]
      - category: "제품리뷰"
        video_cut: "비포/애프터 반전이 나오고 1초 뒤"
        sfx: ["Oh my goodness", "No"]
      - category: "대결/승부"
        video_cut: "마지막 슛을 쏘거나 도망가는 타점"
        sfx: ["Yeah", "Oh God"]
      - category: "정보/이슈"
        video_cut: "한 줄 평이 끝난 직후"
        sfx: ["씁쓸하네요"]
    cta: "명시적 CTA 없음. 감탄사로 끊고 끝낸다. (구독 유도는 설명란에서)"

  # ★ 이 채널의 최대 무기. compose_short.py 로 구현하려면 마지막 shot 을
  #   무음(narration: "")으로 두고 duration 을 0.6~1.0 초로 잡으면 됩니다.
  silence_trick:
    enabled: true
    note: "긴장 음악을 깔다가 마지막 감탄사 타점에서 BGM·소음을 전부 0으로 뮤트. 무음 + 블랙아웃 조합."
    blackout_seconds: 0.8

# ---------------------------------------------------------------
# 3. 자막 — compose_short.py 가 그대로 읽는다
# ---------------------------------------------------------------
subtitle:
  # ★ 시스템에 실제로 설치된 패밀리명과 정확히 일치해야 합니다.
  #   틀리면 libass 가 에러를 내지 않고 조용히 기본 폰트로 떨어집니다.
  #   영상을 눈으로 보기 전까지 모릅니다. compose_short.py 가 미리 경고를 띄웁니다.
  #
  #   확인:  python compose_short.py check --style <이 파일>       (어디서나)
  #          fc-list :lang=ko family | tr ',' '\n' | sort -u      (Linux/WSL)
  #   --style 을 빼면 폰트는 검사하지 않습니다.
  #
  #   Pretendard 를 기본으로 둡니다. 이름이 정확히 하나라 매칭 실패가 없고
  #   쇼츠 자막용으로 자간·굵기가 좋습니다.  https://github.com/orioncactus/pretendard
  #
  #   대체 후보 (설치된 것으로 바꾸세요):
  #     "Malgun Gothic"      - Windows 기본. 별도 설치 불필요
  #     "Noto Sans KR"       - 이름이 정확히 일치할 때만
  #     "Noto Sans CJK KR"   - ⚠ 배포판에 따라 굵기 없는 순수 패밀리명이 없습니다.
  #                            Black/Bold/Regular 만 등록된 시스템에서는 매칭에 실패합니다.
  font_family: "Pretendard"
  font_file: ""
  font_size: 96                     # 시청자가 55~75세다. 작으면 안 읽는다.
  bold: true
  primary_color: "&H00FFFFFF"       # 흰색
  outline_color: "&H00000000"       # 검정 외곽선
  outline_width: 6
  shadow: 0
  alignment: 2                      # 하단 중앙
  # 1920 기준 700 이면 화면 아래에서 약 36% — 하단 1/3~2/5 지점.
  # 쇼츠 UI 를 확실히 피하고 시선이 머무는 자리다.
  margin_vertical: 700
  max_chars_per_cue: 14             # 글자가 커졌으니 한 줄에 덜 들어간다

  # 강조색. shotlist 의 shot.highlight 에 적은 단어가 이 색으로 나온다.
  # ASS 는 &HBBGGRR 순서라 RGB 와 반대다. 아래는 RGB FFD700 (금색).
  # 숫자와 반전 지점에만 쓴다. 남발하면 강조가 아니라 소음이 된다.
  highlight_color: "&H0000D7FF"
  lead_seconds: -0.05               # 소리보다 아주 살짝 먼저
  style_note: "비포/애프터나 반전 구간에서는 자막이 즉시 바뀌며 '사이다'를 준다. 강조어는 색을 바꿔도 좋다."

  # 보조 자막 — shotlist 의 "note" 필드가 이 스타일로 렌더링됩니다.
  # 출처, 기준값("체중 70kg 기준"), 다음 편 예고처럼
  # 본문을 방해하지 않고 작게 깔아야 하는 것에 씁니다.
  # 쪼개지 않고 그 shot 전체에 한 줄로 표시됩니다.
  secondary:
    # 본 자막보다 작되 "안 읽힐 만큼" 작으면 넣는 의미가 없습니다.
    # 38pt 로 해봤더니 화면에서 안 보였습니다. 52pt 가 하한입니다.
    font_size: 52
    primary_color: "&H00D2D2D2"     # 살짝 어두운 흰색 — 본문과 위계만 만든다
    outline_color: "&H00000000"
    outline_width: 4
    bold: false
    alignment: 2                    # 하단 중앙
    margin_vertical: 560            # 본 자막(700) 바로 아래

# ---------------------------------------------------------------
# 4. 목소리
# ---------------------------------------------------------------
voice:
  # edge     — 무료. 기계적으로 들린다. 연습용.
  # typecast — 유료. 훨씬 자연스럽다. name 에 tc_ 로 시작하는 voice_id 를 넣고
  #            setup_keys.py 로 TYPECAST_API_KEY 를 넣어두면 된다.
  # none     — 무음. shot 마다 duration 을 준다.
  #
  # 또는 shotlist 최상위에 "audio": "narration.mp3" 를 두면 밖에서 만든
  # 나레이션 파일 하나를 통째로 쓴다. 타입캐스트 웹에서 받아 쓸 때 편하다.
  provider: "edge"
  name: "ko-KR-InJoonNeural"        # typecast 로 바꾸면 tc_... 형식
  # typecast 전용 (provider 가 typecast 일 때만 쓰임)
  # model: "ssfm-v30"
  # language: "kor"
  # emotion_prompt: "차분하게 설명하듯"
  rate: "+15%"                      # edge 전용. 몰아치는 속도
  pitch: "+0Hz"
  volume: "+0%"
  tone_note: "빠르고 담백. 과장된 리액션은 나레이션이 아니라 효과음이 맡는다."
  silent_sections: "엔딩 감탄사 직후 0.8초. silence_trick 참고."

# ---------------------------------------------------------------
# 5. 영상
# ---------------------------------------------------------------
visual:
  aspect_ratio: "9:16"
  resolution: "1080x1920"
  fps: 30
  # 생성 클립이 shot 보다 짧을 때, 이 배수 이하면 재생을 늦춰서 채웁니다.
  # 넘으면 루프하고 경고를 띄웁니다 — 이어지는 지점에서 화면이 튀기 때문입니다.
  # 실측: Higgsfield 생성 클립은 5초 안팎입니다. shot 을 10초 넘게 잡지 마세요.
  max_slowdown: 2.0
  # 최종 배속. 자막을 구운 뒤에 걸리므로 자막도 같이 빨라집니다.
  # 오디오는 atempo 로 맞춰서 목소리 높이가 변하지 않습니다.
  # 1.1 이면 몰아치는 느낌이 살아납니다. 0.5~2.0 범위만 됩니다.
  playback_speed: 1.1
  mood: "채도·대비 강함. 밝고 선명하게."
  camera: "고정샷과 클로즈업 교차. 절정 구간에서 급격한 줌인 1회."
  subject_type: "실사 기반"
  bgm_note: "긴장감 있는 BGM을 깔다가 엔딩 타점에 전면 뮤트."
  recurring: "질문형 오프닝 자막 → 빠른 실패 몽타주 → 절단 엔딩"

# ---------------------------------------------------------------
# 5.5 물량 모델은 복제하지 않는다  ★ 실측이 드러낸 가장 중요한 사실
# ---------------------------------------------------------------
# 이 채널은 하루 2.2편, 누적 2,318편으로 히트를 뽑아내는 물량 x 확률 게임입니다.
# 그런데 그 물량을 AI로 재현하면, YouTube 가 2025년 7월부터 겨냥하고 있는
# "대량 양산 비진정성 콘텐츠" 의 정확한 표적이 됩니다.
#
# 사람이 촬영·편집해서 하루 2편을 뽑는 것과, 프롬프트를 갈아끼워 하루 2편을
# 뽑는 것은 심사에서 다르게 취급됩니다. 전자는 노동이고 후자는 양산입니다.
#
# 따라서 이 채널에서 가져올 것과 버릴 것이 갈립니다.
ai_volume_warning:
  copy: ["후킹 공식", "핑퐁 전개", "절단마공 엔딩", "컷 리듬", "자막 스타일"]
  do_not_copy: ["하루 2.2편의 발행 물량", "같은 템플릿의 대량 반복"]
  recommended_cadence_per_week: [3, 5]
  rule: >
    편수가 아니라 "각 편이 서로 다른 기획인가"가 기준이다.
    주 3편이라도 세 편의 각도가 같으면 양산이고,
    주 5편이라도 각각 다른 관점이면 양산이 아니다.
    daily_video_cap 은 3 을 넘기지 않는다.

  # 구독 전환율 0.014% 가 뜻하는 것
  business_model_mismatch: >
    이 채널은 쇼츠 RPM 단가로만 버는 구조다. 조회수 24.5억에 구독자 35.4만이면
    채널 자산이 거의 안 쌓인다는 뜻이다. 나중에 상품을 팔 계획이라면
    이 채널은 "트래픽 벤치마크"로만 쓰고, 구독·전환 설계는 다른 레퍼런스에서
    가져와야 한다. 편집 문법과 사업 모델을 한 채널에서 같이 배우려 하지 말 것.

# ---------------------------------------------------------------
# 6. AI 생성 적합도 — 이 채널을 그대로 따라 할 수 없는 이유
# ---------------------------------------------------------------
# 이 채널의 가치는 상당 부분 "실제로 해봤다"에서 나옵니다.
# AI로 만든 실험 영상은 실험이 아니라 연출입니다. 그래서 카테고리마다
# 옮길 수 있는 정도가 다릅니다. 기획 단계에서 반드시 확인하세요.
ai_fit:
  - category: "기발한가설형 (만약에)"
    fit: "high"
    condition: "명백히 상상/시뮬레이션임이 드러나는 연출로 갈 때. 실사인 척하지 않으면 AI가 가장 잘하는 영역."
  - category: "라이벌대결형"
    fit: "medium"
    condition: "실존 인물·실제 경기가 아니라 가상 캐릭터 대결로 바꿀 때."
  - category: "Pain-Point형 (제품리뷰)"
    fit: "low"
    condition: "실제 제품을 실제로 써본 게 아니면 허위 광고가 됩니다. 제품 없이 하지 마세요."
  - category: "충격선언형 (해외이슈)"
    fit: "avoid"
    condition: "실제 사건을 AI로 재현하면 허위 정보입니다. 이 파이프라인에서는 만들지 않습니다."

# ---------------------------------------------------------------
# 7. 따라 하지 않을 것
# ---------------------------------------------------------------
do_not_copy:
  - "위 예시 문구를 그대로 쓰기 — 문장 틀만 가져오고 소재는 직접 정한다"
  - "같은 소재로 같은 실험 재현하기"
  - "원본 영상 클립, 로고, 시그니처 사운드 파일"
  - "'진짜 잠깐만'과 헷갈릴 만한 채널명"
  - "실존 인물·특정 국적 집단을 대상으로 한 조롱·비하"

guardrails:
  high_risk_categories:
    - name: "해외이슈 / 국가·민족 저격"
      risk: "YouTube 증오심 표현 정책 위반 가능. 수익화 정지 사유."
      rule: "특정 국적·민족·집단을 싸잡아 비하하는 소재는 만들지 않는다."
    - name: "AI로 재현한 '실제 사건'"
      risk: "허위 정보 + 합성 미디어 정책 위반."
      rule: "실제로 일어난 일처럼 보이는 장면을 AI로 만들지 않는다. 상상·시뮬레이션임을 연출과 자막으로 드러낸다."
    - name: "써보지 않은 제품 리뷰"
      risk: "허위 광고. 표시광고법 문제로도 번진다."
      rule: "실물 없이 제품 효과를 주장하지 않는다."
