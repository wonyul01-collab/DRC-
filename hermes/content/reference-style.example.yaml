# 레퍼런스 채널 스타일 — 참고 채널의 "문법"을 기계가 읽을 수 있게 적어둔 파일.
#
# 이 파일은 손으로 채워도 되고, 옵시디언/NotebookLM 분석 노트를 넘겨주면
# `yt-style-extract` 스킬이 채워줍니다.
# 저장 위치: ~/.hermes/workspace/youtube/reference-style.yaml
#
# 주의: 여기 담는 것은 "포맷과 문법"이지 "대본"이 아닙니다.
#       남의 대본을 그대로 옮기면 재사용 콘텐츠로 걸립니다. 공식만 가져옵니다.

reference:
  channel_name: "진짜 잠깐만"
  channel_url: ""
  analyzed_videos: 0            # 분석에 쓴 영상 편수
  analyzed_at: ""               # YYYY-MM-DD
  # 이 채널을 한 문장으로. "무엇을 어떤 태도로 보여주는 채널인가."
  one_line: ""

# ---------------------------------------------------------------
# 1. 후킹 — 첫 2~3초. 여기가 전부다.
# ---------------------------------------------------------------
hooking:
  # 이 채널이 쓰는 후킹 유형들. 분석에서 실제로 발견된 것만 적는다.
  types:
    - name: ""                  # 예: "라이벌구도", "만약에", "Pain-Point", "충격선언"
      pattern: ""               # 문장 틀. 예: "A vs B, 이기는 쪽은?"
      example_structure: ""     # 실제 예시를 그대로 베끼지 말고 구조만
      frequency: ""             # high | medium | low
  # 첫 화면에 뜨는 자막의 규칙
  opening_caption:
    max_chars: 0                # 한 줄 최대 글자수
    lines: 0                    # 몇 줄까지
    timing_seconds: 0.0         # 몇 초에 뜨고 몇 초에 사라지는가
    style_note: ""              # 예: "전체 화면 중앙, 배경 딤 처리"
  # 후킹 직후 이탈을 막는 장치
  retention_device: ""          # 예: "질문 던지고 답을 마지막에 준다"

# ---------------------------------------------------------------
# 2. 구조 — 전체 흐름
# ---------------------------------------------------------------
structure:
  total_seconds: [0, 0]         # 최소, 최대
  beats:                        # 시간대별 역할
    - range_seconds: [0, 2]
      role: ""                  # 예: "훅"
      note: ""
  cut_rhythm:
    avg_shot_seconds: 0.0       # 평균 컷 길이
    style: ""                   # 예: "절단마공 — 말 끝나기 전에 자름"
  ending:
    signature: ""               # 예: 고정 엔딩 멘트/사운드
    cta: ""                     # 마지막에 무엇을 시키는가

# ---------------------------------------------------------------
# 3. 자막 — compose_short.py 가 그대로 읽어서 렌더링한다
# ---------------------------------------------------------------
subtitle:
  # 시스템에 설치된 실제 패밀리명과 정확히 일치해야 한다. 틀리면 에러 없이
  # 기본 폰트로 떨어진다. 확인: fc-list :lang=ko family | tr ',' '\n' | sort -u
  # Pretendard 권장. "Noto Sans CJK KR" 은 굵기 없는 순수명이 없는 배포판이 있어 위험.
  font_family: "Pretendard"
  font_file: ""                 # 폰트 파일 절대경로 (지정하면 이쪽이 우선)
  font_size: 72                 # 1080x1920 기준
  bold: true
  primary_color: "&H00FFFFFF"   # ASS 색상 (&HAABBGGRR). 여기서는 흰색
  outline_color: "&H00000000"   # 검정 외곽선
  outline_width: 4
  shadow: 0
  # 화면 어디에 놓을지. ASS alignment: 2=하단중앙, 5=화면중앙, 8=상단중앙
  alignment: 2
  margin_vertical: 320          # 하단에서 띄울 픽셀. 쇼츠 UI에 안 가리게.
  # 한 번에 몇 글자씩 띄우는가. 이 채널이 단어 단위로 툭툭 던지면 작게.
  max_chars_per_cue: 18
  # 자막이 대사보다 살짝 먼저/늦게 뜨는가 (초). 음수면 먼저.
  lead_seconds: 0.0
  style_note: ""                # 강조색, 흔들림, 팝업 등 특징

# ---------------------------------------------------------------
# 4. 목소리 — 나레이션
# ---------------------------------------------------------------
voice:
  provider: "edge"              # edge | elevenlabs | file | none
  name: "ko-KR-InJoonNeural"    # edge 기준. 여성은 ko-KR-SunHiNeural
  rate: "+12%"                  # 쇼츠는 보통 살짝 빠르게
  pitch: "+0Hz"
  volume: "+0%"
  tone_note: ""                 # 예: "담백하고 빠름. 감탄사 없음."
  # 나레이션 없이 자막+BGM만 쓰는 구간이 있으면 여기 적는다
  silent_sections: ""

# ---------------------------------------------------------------
# 5. 영상 — Higgsfield 프롬프트에 반영할 톤
# ---------------------------------------------------------------
visual:
  aspect_ratio: "9:16"
  resolution: "1080x1920"
  fps: 30
  mood: ""                      # 예: "채도 높고 대비 강함"
  camera: ""                    # 예: "고정샷 위주, 급격한 줌인 1회"
  subject_type: ""              # 실사 / 애니 / 그래픽 / 혼합
  bgm_note: ""                  # BGM 유무와 성격
  # 매 회차 반복되는 시각 요소 (채널 정체성)
  recurring: ""

# ---------------------------------------------------------------
# 6. 따라 하지 않을 것 — 선을 명시해 둔다
# ---------------------------------------------------------------
do_not_copy:
  - "대본 문장을 그대로 가져오기"
  - "채널 로고, 워터마크, 고유 캐릭터"
  - "원본 영상 클립 자체를 재사용하기"
  - "채널명과 혼동될 만한 이름 쓰기"
