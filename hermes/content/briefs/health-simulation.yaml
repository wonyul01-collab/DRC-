# 채널 브리프 — 건강·신체 시뮬레이션 ("만약에" 계열)
#
# 방향 A 선택에 따른 초안입니다. 빈칸(채널명·URL)만 채우면 바로 쓸 수 있습니다.
# ~/.hermes/workspace/youtube/channel-brief.yaml 로 복사해서 쓰세요.
#
# 설계 의도:
#   - reference-style.yaml 의 ai_fit 에서 "기발한가설형 = high" 인 영역만 공략합니다.
#     조건은 "명백히 상상·시뮬레이션임이 드러나는 연출". 그래서 실사 인물이 아니라
#     반투명 인체 모델로 갑니다. 실존 인물 재현 문제도, 허위 정보 문제도 없습니다.
#   - 지금은 practice 지만, 나중에 고관절·낙상 보호 제품으로 이어질 수 있는
#     시청자층을 미리 모읍니다. 연습으로 쌓은 구독자가 그대로 자산이 됩니다.

stage: "practice"

channel:
  name: ""                       # ← 채워주세요
  url: ""                        # ← 개설 후 채워주세요
  language: "ko"
  positioning: >
    걷고 앉고 넘어질 때 몸 안에서 실제로 무슨 일이 벌어지는지,
    40초짜리 시뮬레이션으로 눈에 보이게 만들어 주는 채널.

audience:
  who: >
    40~60대. 무릎·허리·고관절이 슬슬 신경 쓰이기 시작했지만 병원에 갈 정도는
    아닌 사람. 부모의 거동을 걱정하는 30~40대 자녀도 같은 영상을 본다.
  pain: >
    "아픈 건 아닌데 뭔가 이상하다." 병원 가기는 애매하고, 검색하면 최악의 경우만
    나와서 무섭다. 내 몸에 지금 무슨 일이 일어나는지 그냥 보고 싶다.
  where: >
    네이버 카페(등산·골프·관절), 유튜브 검색 "무릎 통증 / 고관절 / 낙상",
    시니어 돌봄 커뮤니티, 부모님께 링크 보내는 카카오톡.

benchmark:
  channel_name: "진짜 잠깐만"
  why: "첫 3초에 시선을 잡고 40초를 끌고 가는 문법이 완성돼 있다."
  learn:
    - "후킹 문장의 틀 (특히 기발한가설형 · 반전형)"
    - "핑퐁 전개 — 우선 → 다음은 → 하지만 → 그래서"
    - "절단마공 엔딩과 무음 처리"
    - "컷 리듬과 자막 스타일"
  avoid:
    - "하루 2편의 발행 물량 — AI로 재현하면 양산 정책 표적이 된다"
    - "대결·실험 소재 자체 (실사가 아니면 성립 안 함)"
    - "국가·집단 저격형 소재"
    - "'진짜 잠깐만'과 헷갈릴 만한 채널명"

format:
  type: "shorts"
  length_seconds: [34, 45]       # reference-style 실측값과 일치
  aspect_ratio: "9:16"
  recurring_elements:
    character: >
      사람이 아니라 반투명 인체 모델. 어두운 배경에 골격과 근육이 은은하게 빛나고,
      힘이 걸리는 부위만 붉게 달아오른다. 매 회차 같은 모델을 쓴다.
      실존 인물 얼굴은 절대 쓰지 않는다.
    opening: >
      질문형 자막 한 줄 + 숫자 하나. 예: "계단 한 칸 내려갈 때, 무릎에 실리는 무게는?"
    visual_style: >
      검은 배경, 청록색 발광 인체, 하중 지점은 주황~빨강 그라데이션.
      숫자와 화살표가 화면에 겹쳐 올라온다.
  tone: >
    담백하고 빠르게. 겁주지 않는다. "위험합니다" 대신 "이만큼 실립니다" 로 말한다.
    숫자가 놀라움을 만들지, 형용사가 만들지 않는다.

cadence:
  # 크레딧 현실 반영: 잔량 1,800, 편당 8클립 기준 월 10~16편.
  # 첫 영상 실측 후 조정하세요.
  videos_per_week: 3
  review_day: "월요일"

# ---- 소재 씨앗 --------------------------------------------------------------
# yt-trend-research 가 참고할 방향입니다. 이대로 만들라는 뜻이 아니라
# "이런 결의 소재를 찾아라" 는 예시입니다. 수요 근거는 매번 새로 확인합니다.
topic_seeds:
  - "계단을 내려갈 때 무릎에 실리는 힘은 체중의 몇 배일까"
  - "옆으로 넘어질 때 고관절이 받는 충격은 어느 정도일까"
  - "하루 8시간 앉아 있으면 척추에 무슨 일이 생길까"
  - "가방을 한쪽으로만 메면 몸이 어떻게 기울까"
  - "무릎을 굽히고 물건을 들 때와 허리로 들 때, 차이가 얼마나 날까"
  # 공통 구조: [일상 동작] → [몸 안에서 벌어지는 일] → [숫자로 확인]
  # 전부 생체역학에 실측 수치가 있는 주제입니다. 지어내지 않습니다.

# ---- 판매 단계에서 채우는 것 (지금은 비워둡니다) ----------------------------
products: []

# 아직 파는 것은 없지만, 소재를 고를 때 이 방향과 어긋나지 않게 합니다.
# monetize 단계로 넘어갈 때 products 로 옮깁니다.
product_horizon:
  planned:
    - "고관절 보호대"
    - "낙상 보호 팬티"
  rule: >
    지금은 아무것도 팔지 않는다. 제품을 암시하지도 않는다.
    다만 소재는 "고관절·낙상·관절 하중" 언저리에서 고른다.
    나중에 제품이 나왔을 때 이 채널의 시청자가 그대로 고객이 되도록.

funnel:
  step1_cta: "다음 편에서는 [다음 주제]를 봅니다. 궁금하면 구독."
  step2_landing: ""
  step3_conversion: ""

# ---- 가드레일 — 건강 주제라 특히 중요합니다 ---------------------------------
guardrails:
  banned_topics:
    - "특정 질병의 진단·치료법"
    - "특정 제품·약·시술의 효과 주장"
    - "'이 증상이면 ○○병입니다' 류의 단정"
    - "공포 조장 (죽음·마비·수술 이미지로 겁주기)"
  claims_policy: >
    의학적 조언을 하지 않는다. 우리는 "몸에 어떤 힘이 걸리는가"를 보여줄 뿐이고,
    "그래서 어떻게 하라"는 말하지 않는다. 수치는 반드시 출처를 확인하고
    영상 설명란에 남긴다. 출처를 못 찾은 숫자는 쓰지 않는다.
    불확실한 값은 "대략", "연구에 따라 다르지만" 으로 범위를 밝힌다.
  likeness_policy: >
    실존 인물의 얼굴·목소리를 쓰지 않는다. 인체 모델은 명백히 CG 로 보이게 한다.
    실제 환자·부상 영상처럼 보이는 장면을 만들지 않는다.
  originality_policy: "벤치마크 채널의 대본·클립·로고 복제 금지. 포맷만 참고."
  synthetic_disclosure: >
    AI 생성물임을 업로드 시 공시한다(--synthetic). 인체 시뮬레이션은 명백한 CG 라
    필수는 아닐 수 있으나, 건강 주제라 밝히는 쪽이 신뢰에 도움이 된다.
