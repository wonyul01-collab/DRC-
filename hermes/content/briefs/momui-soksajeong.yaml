# 채널 브리프 — 몸의 속사정
#
# ~/.hermes/workspace/youtube/channel-brief.yaml 로 복사해서 씁니다.
#   BRIEF=momui-soksajeong bash install.sh
#   $env:BRIEF = 'momui-soksajeong'   (PowerShell)
#
# 설계 의도:
#   - reference-style.yaml 의 ai_fit 에서 "기발한가설형 = high" 인 영역만 공략한다.
#     조건은 "명백히 상상·시뮬레이션임이 드러나는 연출". 그래서 실사 인물이 아니라
#     반투명 인체 모델로 간다. 실존 인물 재현 문제도, 허위 정보 문제도 없다.
#   - 말로 꺼내기 어려운 주제일수록 그림으로 보여주는 쪽이 품위 있다.
#     이 채널의 존재 이유가 거기에 있다.
#   - 지금은 practice 지만, 나중에 샐리브 제품군으로 이어질 시청자를 미리 모은다.

stage: "practice"

channel:
  name: "몸의 속사정"
  url: "https://www.youtube.com/@몸의속사정"
  channel_id: "UCquJ4vugjON-2t5Clp569fQ"   # 성과 분석에 쓰입니다
  language: "ko"
  positioning: >
    걷고 앉고 돌아눕는 일상의 동작에서 몸 안에 무슨 일이 벌어지는지,
    40초짜리 시뮬레이션으로 눈에 보이게 만들어 주는 채널.
    말로 꺼내기 어려운 불편일수록 그림으로 담담하게 설명한다.

audience:
  # 시니어 집중(방향 A). 생리·여성 건강은 채널이 자리 잡은 뒤
  # "골반저근" 이라는 공통 축으로 넓힌다. 지금은 넣지 않는다.
  who: >
    주 시청자는 55~75세. 무릎과 허리가 예전 같지 않고, 화장실이 신경 쓰이기
    시작했지만 병원에 갈 정도는 아니고 자식에게 말하기도 뭣한 사람.
    부 시청자는 45~60세 자녀. 부모 걱정으로 검색하고 링크를 보내는 쪽이며,
    실제 구매를 결정하는 경우가 많다.
  pain: >
    몸이 예전 같지 않은데 어디에 물어야 할지 모른다. 검색하면 광고 아니면
    최악의 경우만 나와서 무섭다. 지금 내 몸에 무슨 일이 일어나는지
    겁먹지 않고 그냥 알고 싶다.
  where: >
    네이버 카페(등산·건강·관절), 유튜브 검색("무릎 통증 / 요실금 / 고관절"),
    가족 단톡방 — 자녀가 부모에게 링크를 보내는 경로가 실제로 크다.

  # ★ 이 채널의 톤을 결정하는 제약. 자녀가 부모에게 보낼 수 있어야 한다.
  #   부모가 열어보고 민망하거나 기분 상하면 그 링크는 다시는 안 돌아다닌다.
  sharing_constraint: >
    "자녀가 부모에게 보내도 민망하지 않은 영상" 이 톤의 기준선이다.
    요실금 같은 주제도 부끄러운 일이 아니라 근육과 압력의 문제로 설명한다.

benchmark:
  channel_name: "진짜 잠깐만"
  why: "첫 3초에 시선을 잡고 40초를 끌고 가는 문법이 완성돼 있다."
  learn:
    - "후킹 문장의 틀 (특히 기발한가설형 · 반전형)"
    - "핑퐁 전개 — 우선 → 다음은 → 하지만 → 그래서"
    - "절단마공 엔딩과 무음 처리"
    - "컷 리듬과 자막 스타일"
  avoid:
    - "하루 2편의 발행 물량 — AI로 재현하면 양산 정책 표적이 된다"
    - "대결·실험 소재 자체 (실사가 아니면 성립 안 함)"
    - "국가·집단 저격형 소재"
    - "자극적 감탄사 엔딩 — 우리 시청자층과 안 맞는다"

format:
  type: "shorts"
  # 대본 기준 40~60초. playback_speed 1.1 이 걸려 최종은 36~55초가 된다.
  # 벤치마크 실측(34~45초)보다 길게 잡는다. 우리는 "경험 → 숫자 → 일상 복귀"
  # 3단 구조라 공감 구간이 앞에 붙기 때문이다. 그 구간을 잘라내면
  # 다시 사전 읽어주는 영상이 된다.
  length_seconds: [40, 60]
  aspect_ratio: "9:16"

  # ★ 대본의 제1원칙. 이게 안 지켜지면 나머지는 의미가 없다.
  storytelling_rule: >
    숫자로 시작하면 남의 이야기가 되고, 경험으로 시작하면 내 이야기가 된다.
    첫 10초는 시청자가 겪은 장면만 쓴다 — 등산 하산길, 지하철 출구 계단,
    아침에 일어날 때, 손주 안아 올릴 때. 장소를 구체적으로 대고
    몸의 느낌("시큰했다", "후들거렸다")으로 말한다. 숫자는 그다음이다.
    마지막은 다시 일상으로 돌아온다 — 그 일이 오늘 어디서 몇 번 일어나는지.

  # 화면 소재 비율. 스톡이 기본이고 AI 는 절정 한 지점에만 쓴다.
  footage_mix:
    stock_ratio: "70~80%"        # 계단·등산·걷기 등 실사. Pexels, 크레딧 0
    ai_clips_per_video: [1, 2]   # 몸 안 시뮬레이션. 스톡으로 대체 불가한 것만
    rule: >
      실사 사이에 딱 한 번 몸 속으로 들어가는 구성이 가장 강하다.
      같은 인체 모델만 40초 내내 나오면 지루하다.
  recurring_elements:
    character: >
      사람이 아니라 반투명 인체 모델. 어두운 배경에 골격·근육·장기가 은은하게
      빛나고, 힘이나 압력이 걸리는 부위만 붉게 달아오른다. 매 회차 같은 모델을 쓴다.
      실존 인물 얼굴은 절대 쓰지 않는다.
    opening: >
      질문형 자막 한 줄 + 숫자 하나.
      예: "계단 한 칸 내려갈 때, 무릎에 실리는 무게는?"
    visual_style: >
      검은 배경, 청록색 발광 인체, 하중·압력 지점은 주황~빨강 그라데이션.
      숫자와 화살표가 화면에 겹쳐 올라온다.
  tone: >
    담백하고 빠르게. 겁주지 않는다. "위험합니다" 대신 "이만큼 실립니다" 로 말한다.
    놀라움은 숫자가 만들지 형용사가 만들지 않는다.

cadence:
  # 실측 확정 (2026-08-13): 편당 4클립 = 110 크레딧.
  # 월 풀 1,800 이므로 최대 16.4편. 주 3편이면 월 13편 = 1,430cr 로 여유가 있다.
  # 주 4편(월 17편)은 1,907cr 이라 넘친다. 3편이 상한이다.
  videos_per_week: 3
  review_day: "월요일"

# ---- 소재 씨앗 --------------------------------------------------------------
# yt-trend-research 가 참고할 방향이다. 이대로 만들라는 뜻이 아니라
# "이런 결의 소재를 찾아라" 는 예시다. 수요 근거는 매번 새로 확인한다.
# 전부 생체역학·생리학에 실측 수치가 있는 주제다. 지어내지 않는다.
topic_seeds:
  관절_하중:
    - "계단을 내려갈 때 무릎에 실리는 힘은 체중의 몇 배일까"
    - "무릎을 굽혀 들 때와 허리로 들 때, 척추에 걸리는 힘은 얼마나 다를까"
    - "발목을 한 번 접질리면 그다음이 왜 쉬워질까"
    - "손목을 이렇게 쓰면 왜 팔꿈치가 아파질까"
  보행_균형:
    - "지팡이를 짚으면 고관절 부담이 실제로 얼마나 줄어들까"
    - "걸음 폭이 5cm 줄면 몸에 무슨 일이 생길까"
    - "옆으로 넘어질 때 고관절이 받는 충격은 어느 정도일까"
  골반저근:
    - "재채기 한 번에 방광에 걸리는 압력은 얼마나 될까"
    - "골반저근은 우리가 가만히 있을 때 무슨 일을 하고 있을까"
  자세:
    - "하루 8시간 앉아 있으면 척추에 무슨 일이 생길까"
    - "가방을 한쪽으로만 메면 몸이 어떻게 기울까"
  # 공통 구조: [일상 동작] → [몸 안에서 벌어지는 일] → [숫자로 확인]

# ---- 판매 단계에서 채우는 것 (지금은 비워둡니다) ----------------------------
products: []

# 아직 파는 것은 없지만, 소재를 고를 때 이 방향과 어긋나지 않게 한다.
# monetize 단계로 넘어갈 때 products 로 옮긴다.
product_horizon:
  brand: "샐리브"
  brand_promise: "일상의 불편함을 보살펴 드리는 제품"
  planned:
    - name: "관절 보호대 (엘보·허리·발목·무릎)"
      topic_bridge: "관절_하중"
    - name: "고관절 보호대 · 낙상 보호 팬티"
      topic_bridge: "보행_균형"
    - name: "요실금 팬티"
      topic_bridge: "골반저근"
    - name: "지팡이"
      topic_bridge: "보행_균형"
    - name: "생리 팬티"
      topic_bridge: "골반저근"
      note: "채널이 자리 잡은 뒤 확장. 지금 단계에서는 다루지 않는다."
  rule: >
    지금은 아무것도 팔지 않는다. 제품을 암시하지도 않는다.
    다만 소재는 위 topic_bridge 안에서 고른다. 제품이 나왔을 때
    이 채널의 시청자가 그대로 고객이 되도록.
    채널명·설명·영상 어디에도 브랜드명을 넣지 않는다. 광고 채널로 읽히면
    초기 유입이 죽는다. 신뢰가 먼저고 브랜드는 나중이다.

funnel:
  step1_cta: "다음 편에서는 [다음 주제]를 봅니다. 궁금하면 구독."
  step2_landing: ""
  step3_conversion: ""

# ---- 가드레일 — 건강 주제라 특히 중요합니다 ---------------------------------
guardrails:
  banned_topics:
    - "특정 질병의 진단·치료법"
    - "특정 제품·약·시술의 효과 주장"
    - "'이 증상이면 ○○병입니다' 류의 단정"
    - "공포 조장 (죽음·마비·수술 이미지로 겁주기)"
    - "생리·여성 건강 (채널 확장 전까지 보류)"
  claims_policy: >
    의학적 조언을 하지 않는다. 우리는 "몸에 어떤 힘과 압력이 걸리는가"를
    보여줄 뿐이고, "그래서 어떻게 하라"는 말하지 않는다.
    수치는 반드시 출처를 확인하고 영상 설명란에 남긴다. 출처를 못 찾은 숫자는
    쓰지 않는다. 불확실한 값은 "대략", "연구에 따라 다르지만" 으로 범위를 밝힌다.
  likeness_policy: >
    실존 인물의 얼굴·목소리를 쓰지 않는다. 인체 모델은 명백히 CG 로 보이게 한다.
    실제 환자·부상 영상처럼 보이는 장면을 만들지 않는다.
  dignity_policy: >
    시청자를 대상화하지 않는다. "노화", "늙으면", "어르신들은" 같은 표현을 쓰지 않고
    "나이가 들면서" 정도로 담담하게 쓴다.
    요실금·실금은 부끄러운 일이 아니라 근육과 압력의 문제로 설명한다.
    골반저근·방광을 다룰 때는 해부학 교과서 수준의 담담함을 유지한다.
    선정적으로 보일 여지가 있으면 그 컷을 버린다.
  originality_policy: "벤치마크 채널의 대본·클립·로고 복제 금지. 포맷만 참고."
  synthetic_disclosure: >
    AI 생성물임을 업로드 시 공시한다(--synthetic). 인체 시뮬레이션은 명백한 CG 라
    필수는 아닐 수 있으나, 건강 주제라 밝히는 쪽이 신뢰에 도움이 된다.
