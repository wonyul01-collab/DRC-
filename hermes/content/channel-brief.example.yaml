# 채널 브리프 — 모든 스킬이 이 파일을 기준으로 판단합니다.
# ~/.hermes/workspace/youtube/channel-brief.yaml 로 복사해서 채우세요.
#
# 지금 단계(쇼츠 제작 연습)에서는 channel / audience / benchmark / format 만 채우면 됩니다.
# products 와 funnel 은 판매를 시작할 때 채우세요. 비어 있어도 파이프라인은 돕니다.

stage: "practice"                # practice(제작 연습) | growth(구독자 확보) | monetize(판매)

channel:
  name: ""                       # 채널명
  url: ""
  language: "ko"
  # 한 문장으로. "누구에게 무엇을 주는 채널인가."
  positioning: ""

audience:
  who: ""                        # 구체적으로. "30대 직장인" 은 너무 넓다.
  pain: ""                       # 이 사람이 실제로 겪는 불편 하나
  where: ""                      # 이 사람이 모여 있는 커뮤니티/검색어

# 벤치마킹하는 채널. 상세 문법은 reference-style.yaml 에 따로 있습니다.
benchmark:
  channel_name: ""               # 예: "진짜 잠깐만"
  why: ""                        # 이 채널의 무엇을 배우려는가
  # 배울 것과 배우지 않을 것을 나눠 적어둡니다.
  learn: []                      # 예: ["후킹 문장 구조", "컷 리듬", "자막 스타일"]
  avoid: []                      # 예: ["같은 소재", "같은 대본", "비슷한 채널명"]

format:
  type: "shorts"                 # shorts | long | both
  length_seconds: [15, 40]
  aspect_ratio: "9:16"
  # 회차마다 유지할 요소. 이게 고정돼야 채널로 인식됩니다.
  recurring_elements:
    character: ""                # 고정 캐릭터/화자 (Higgsfield Soul 로 일관성 유지)
    opening: ""                  # 매 회차 반복하는 오프닝 패턴
    visual_style: ""             # 색감/조명/편집 톤
  tone: ""                       # 예: "담백하고 빠르게. 과장 없음."

cadence:
  # 벤치마크 채널이 주 15.7편을 찍는다고 따라가지 마세요.
  # 사람이 촬영·편집해서 그 물량을 내는 것과, AI로 같은 물량을 내는 것은
  # YouTube 심사에서 다르게 취급됩니다 (후자는 "대량 양산"의 표적).
  # 주 3~5편으로 시작하고, 편수보다 각 편의 각도가 다른지를 지키세요.
  videos_per_week: 3
  review_day: "월요일"

# ---- 판매 단계에서 채우는 것 (지금은 비워둬도 됩니다) ----------------------
products: []
  # - name: ""                   # 예: "엑셀 함수 치트시트 PDF"
  #   type: ""                   # lead_magnet | digital_product | service | affiliate
  #   price: ""
  #   link: ""
  #   fits_content: ""

funnel:
  step1_cta: ""                  # 영상 마지막 한 문장. 판매 전에는 "구독" 정도로 둡니다.
  step2_landing: ""
  step3_conversion: ""

# 절대 다루지 않을 것. 에이전트가 여기 걸리는 소재를 제안하면 스스로 버립니다.
guardrails:
  banned_topics: []              # 예: ["정치", "특정 종목 매수 추천"]
  claims_policy: "단정적 효능·수익 보장 표현 금지. 수치 인용 시 출처 명시."
  likeness_policy: "실존 인물의 얼굴·목소리 재현 금지."
  originality_policy: "벤치마크 채널의 대본·클립·로고 복제 금지. 포맷만 참고."
