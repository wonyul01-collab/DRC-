# ~/.hermes/config.yaml 에 병합할 설정 조각
# ---------------------------------------------------------------
# 사용법: 아래 블록들을 기존 ~/.hermes/config.yaml 의
#         같은 이름 최상위 키에 "병합" 하세요. 파일 전체를 덮어쓰지 마세요.
#         비밀값(API 키/토큰)은 config.yaml 이 아니라 ~/.hermes/.env 에 둡니다.
# 적용 후: hermes mcp login higgsfield
#
# ⚠ `hermes tools` 와 `hermes mcp configure` 를 확인용으로 쓰지 마세요.
#   둘 다 조회 명령이 아니라 대화형 선택 UI 입니다. 에이전트·스크립트·백그라운드
#   처럼 stdin 이 없는 곳에서 실행하면 선택 결과가 config.yaml 에 써져서
#   platform_toolsets 같은 값이 통째로 덮어써집니다. 실제로 그 사고가 났습니다.
#   등록 확인은 login 출력의 "Authenticated — N tool(s) available" 로 하세요.

mcp_servers:
  # Higgsfield 공식 호스티드 MCP (영상/이미지 생성)
  # - 엔드포인트: https://mcp.higgsfield.ai/mcp
  # - 인증: OAuth (API 키 없음). 최초 1회 `hermes mcp login higgsfield` 로 브라우저 인증
  # - Higgsfield 유료 구독 필요 (크레딧이 소진되면 생성 툴이 실패합니다)
  higgsfield:
    url: "https://mcp.higgsfield.ai/mcp"
    auth: oauth
    enabled: true
    # 영상 렌더링은 오래 걸립니다. 기본 타임아웃으로는 자주 끊깁니다.
    # 실측: 클립 1개당 약 4분, 4개 순차 생성에 16분 이상.
    # jobs_wait 는 보통 이 안에서 끊고 재호출하는 구조라 900 으로도 버티지만,
    # 모델·혼잡도에 따라 단일 호출이 15분을 넘길 수 있어 여유를 뒀습니다.
    # 여기서 끊기면 크레딧은 이미 나간 뒤라 손해가 큽니다.
    timeout: 1800
    connect_timeout: 30
    # 크레딧 낭비를 막기 위해 동시 호출을 끕니다.
    supports_parallel_tool_calls: false
    tools:
      # ★ include 는 화이트리스트입니다. 여기 적힌 것만 에이전트에게 노출됩니다.
      #   Higgsfield MCP 는 86개 툴을 내보내는데 그중에 결제 계열이 섞여 있습니다
      #   (confirm_billing_purchase, cancel_trial_auto_renewal 등).
      #
      # ⚠ 결제·구매·구독 변경 계열은 include 에 절대 넣지 마세요.
      #   돈이 나가고 되돌릴 수 없는 동작입니다. cron 으로 무인 실행될 때
      #   "크레딧이 부족하니 사면 되겠네" 로 이어질 수 있습니다.
      #   문서상 include 와 exclude 가 같이 있으면 include 가 이깁니다.
      #   그래서 방어선은 exclude 가 아니라 include 를 좁게 유지하는 것입니다.
      #
      # 아래는 이름을 모르는 상태의 임시 글롭입니다. 실제 툴 이름을 확보하면
      # 정확한 이름 목록으로 바꾸세요 (글롭보다 오탐이 없습니다).
      # 툴 이름은 Hermes 대화창에서 에이전트에게 물어보면 됩니다
      # ("지금 쓸 수 있는 higgsfield 툴 이름을 나열해줘"). CLI 로 확인하려 들지 마세요.
      include:
        - "generate_*"      # 영상·이미지 생성
        - "get_*"           # 조회 (잔액·작업상태 포함, 읽기 전용)
        - "list_*"          # 목록 (모델·프리셋)
      prompts: true
      resources: true

skills:
  config:
    # yt-shorts-factory 스킬이 읽는 값들. 채널마다 바꿔서 쓰세요.
    yt-shorts-factory:
      # 채널 브리프 경로 (content/channel-brief.example.yaml 를 복사해서 작성)
      brief_path: "~/.hermes/workspace/youtube/channel-brief.yaml"
      # 벤치마크 채널의 문법 (yt-style-extract 가 만들어 줍니다)
      style_path: "~/.hermes/workspace/youtube/reference-style.yaml"
      # 파이썬 스크립트 위치
      scripts_dir: "~/.hermes/workspace/youtube/scripts"
      # 생성물 저장 위치
      output_dir: "~/.hermes/workspace/youtube/out"
      # ---- 크레딧 가드 --------------------------------------------------
      # 편수 상한만으로는 크레딧을 못 지킵니다. 쇼츠 1편은 생성 1회가 아니라
      # 컷 여러 개를 뽑기 때문입니다. 최악의 경우(20컷 x 45cr) 하루 2편이면
      # 월 1,800 크레딧을 하루에 다 씁니다. 그래서 세 겹으로 막습니다.

      # 1) 하루 최대 편수 — 폭주 루프 차단
      daily_video_cap: 2

      # 2) 편당 최대 생성 클립 수 — 이게 실질적인 비용 통제선입니다.
      #    ★ shot 수 상한이 아닙니다. 클립 4개로 shot 20개를 만듭니다.
      #    compose_short.py 는 같은 클립을 여러 shot 이 참조해도 정상 동작하고,
      #    자막·나레이션이 바뀌면 시청자에게는 다른 컷으로 읽힙니다.
      #
      #    실측 기준 편당 예산:
      #      4클립 = 110cr → 월 16.4편  (주 3편이면 월 1,430cr, 여유)
      #      6클립 = 165cr → 월 10.9편  (주 3편이면 초과)
      #      8클립 = 220cr → 월  8.2편  (주 3편이면 초과)
      #    주 3편을 지키려면 4클립이 상한입니다.
      max_clips_per_video: 4

      # 3) 잔량 바닥 — balance 가 이 아래면 생성하지 않고 중단합니다.
      #    편당 110cr 이므로 두 편치 여유입니다.
      min_credit_floor: 220

      # 실측값 (2026-08-13, 첫 영상)
      #   1,800 → 1,690. 4클립(720x1280, 5초)에 110 크레딧.
      #   클립 1개당 27.5 크레딧.
      #   해상도를 1080p 로 올리면 대략 2배가 되어 월 8편으로 반토막 납니다.
      measured_credits_per_video: 110
      measured_credits_per_clip: 27.5

      # 업로드 기본 공개 상태. 반드시 private 로 시작하세요 (사람 검수 후 공개).
      default_privacy: "private"

cron:
  # 예약 작업이 쓸 기본 모델. 계정에 맞게 조정하세요.
  model_provider: "anthropic"
  model: "claude-opus-5"
  preflight: true
  model_drift_guard: true
  wrap_response: true
  script_timeout_seconds: 3600
