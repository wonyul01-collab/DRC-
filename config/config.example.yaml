# adops 설정 예시
#
# 실제 사용 시 config/config.yaml 로 복사한 뒤 값을 채우세요.
# config.yaml 은 .gitignore 되어 있습니다 (원가·마진은 대외비이므로).
#
# PyYAML 이 없는 환경이면 같은 내용을 config/config.json 으로 두면 됩니다.

# --- 채널 수수료율 ----------------------------------------------------------
# 플랫폼 판매수수료 + 결제수수료 합산. 반드시 실제 정산 기준으로 맞추세요.
# 이 값이 틀리면 손익분기 ROAS가 통째로 틀어지고, 리포트의 모든 판정이
# 무의미해집니다. 정산서에서 확인한 실효 수수료율을 쓰세요.
channel_fees:
  smartstore: 0.0585      # 네이버 스마트스토어 (수수료 + 네이버페이)
  coupang: 0.108          # 쿠팡 마켓플레이스 (카테고리별로 다름 — 실제값 확인 필수)
  own: 0.033              # 자사몰 PG 결제수수료

# 카탈로그에 원가가 없는 SKU에 적용할 기본 매출총이익률.
# 임시방편일 뿐이므로, catalog CSV에 실제 원가를 넣는 것이 훨씬 정확합니다.
default_gross_margin_rate: 0.45

# --- 낭비 키워드 판정 기준 ---------------------------------------------------
waste_rules:
  lookback_days: 30
  min_clicks: 20          # 표본 부족 키워드를 죽이지 않기 위한 하한
  min_cost: 30000         # 이보다 적게 쓴 키워드는 노이즈로 간주
  high_cpc_multiple: 1.8  # 채널 중앙 CPC 대비 이 배수를 넘으면 '고CPC'
  low_cvr_ratio: 0.5      # 채널 중앙 전환율 대비 이 비율 미만이면 '저전환'

# --- 리포트 ------------------------------------------------------------------
report:
  top_keywords: 15
  trend_top_keywords: 8
  currency: KRW
  timezone: Asia/Seoul

# --- 브랜드 키워드 -----------------------------------------------------------
# 자연검색으로 이미 상위 노출 중이라, 광고비가 잠식성 지출일 가능성이 있는
# 키워드. 여기 적힌 키워드는 별도 진단 규칙이 적용됩니다.
brand_keywords:
  - 우리브랜드명
  - 우리브랜드 영문명

# --- 월 목표 -----------------------------------------------------------------
# 월마감 분석에서 달성률 계산에 씁니다.
targets:
  "2026-08":
    sales: 120000000
    ad_cost: 18000000

# --- 경쟁사 -----------------------------------------------------------------
# 월마감 상세분석에서 Hermes가 웹 검색으로 동향을 조사할 대상.
competitors:
  - name: 경쟁사A
    keywords: [경쟁사A 브랜드명]
    channels: [smartstore, coupang]
  - name: 경쟁사B
    keywords: [경쟁사B 브랜드명]
    channels: [coupang]

# --- 데이터 소스 -------------------------------------------------------------
# enabled: false 인 소스는 건너뜁니다. 자격증명이 없으면 자동으로 건너뛰므로
# 일단 전부 켜두고 되는 것부터 쓰셔도 됩니다.
sources:
  csv:
    enabled: true
    # root: /opt/data/adops/raw     # 기본값은 <repo>/data/raw

  naver_sa:
    enabled: false
    store_channel: smartstore
    # 자격증명은 환경변수로: NAVER_AD_API_KEY / NAVER_AD_SECRET_KEY / NAVER_AD_CUSTOMER_ID

  coupang_ads:
    enabled: false
    # COUPANG_ACCESS_KEY / COUPANG_SECRET_KEY / COUPANG_VENDOR_ID

  meta:
    enabled: false
    store_channel: own      # 메타 광고가 주로 어느 몰로 보내는지
    # META_ACCESS_TOKEN / META_AD_ACCOUNT_ID

  google:
    enabled: false
    store_channel: own
    # GOOGLE_ADS_CUSTOMER_ID + google-ads.yaml
